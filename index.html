<title>Xirfad Wadaag Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: LMS marketplace — sale strip, navy hero, filterable catalog; student + admin apps use a sidebar shell */
:root{
  --navy:#014689; --blue:#178AFF; --blue-soft:#E3F0FF;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EEF3F9; --line:#D9E3EF;
  --ink:#0B1B2E; --ink-2:#4A5A6E;
  --ok:#15803D; --ok-bg:#E3F5E9; --warn:#B45309; --warn-bg:#FDF1DC; --bad:#B91C1C; --bad-bg:#FBE4E4; --gold:#D99A00;
  --hero:#014689; --hero-2:#02315F; --cover-a:#014689; --cover-b:#178AFF;
  --f-display:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgba(1,40,90,.06),0 10px 28px rgba(1,40,90,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#5AA9FF; --blue:#3D9DFF; --blue-soft:#11294A;
  --bg:#07111F; --surface:#0D1A2C; --surface-2:#132339; --line:#1F3350;
  --ink:#E7EEF7; --ink-2:#9AAAC0;
  --ok:#4ADE80; --ok-bg:#0F2A1B; --warn:#FBBF24; --warn-bg:#2E2210; --bad:#F87171; --bad-bg:#311416; --gold:#FBBF24;
  --hero:#06264A; --hero-2:#04182F; --cover-a:#073A72; --cover-b:#1772D6; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#5AA9FF; --blue:#3D9DFF; --blue-soft:#11294A;
  --bg:#07111F; --surface:#0D1A2C; --surface-2:#132339; --line:#1F3350;
  --ink:#E7EEF7; --ink-2:#9AAAC0;
  --ok:#4ADE80; --ok-bg:#0F2A1B; --warn:#FBBF24; --warn-bg:#2E2210; --bad:#F87171; --bad-bg:#311416; --gold:#FBBF24;
  --hero:#06264A; --hero-2:#04182F; --cover-a:#073A72; --cover-b:#1772D6; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dot{color:var(--blue)}
.eyebrow{font-family:var(--f-display);font-size:.76rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#0B78E8}
.btn-navy{background:#014689;color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-light{background:#fff;color:#014689}
.btn-sm{padding:7px 13px;font-size:.87rem;border-radius:8px}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:transparent;color:var(--bad);border:1.5px solid currentColor}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* sale strip */
.sale{background:#178AFF;color:#fff;font-size:.92rem}
.sale .wrap{display:flex;align-items:center;justify-content:center;gap:14px;padding-block:8px;flex-wrap:wrap;text-align:center}
.sale b{font-family:var(--f-display)}
.cd{display:inline-flex;gap:4px;font-family:var(--f-mono);font-size:.85rem}
.cd span{background:rgba(1,40,90,.35);padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.sale button{background:#fff;color:#014689;border:0;border-radius:999px;padding:4px 12px;font-weight:600;cursor:pointer;font-size:.85rem}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;flex:none}
.brand img{height:40px;width:auto}
.brand .acad{font-family:var(--f-display);font-weight:600;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);border-left:1.5px solid var(--line);padding-left:10px;line-height:1.2}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block}
nav.links{display:flex;gap:2px;margin-left:12px}
nav.links button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav.links button:hover,nav.links button.on{color:var(--ink);background:var(--surface-2)}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.icon-round{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-round:hover{color:var(--blue);border-color:var(--blue)}
.menu-btn{display:none}
.userchip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:0;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600;font-size:.9rem}
.userchip i{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.8rem}
@media (max-width:980px){
  nav.links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);margin:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  nav.links.open{display:flex}
  .menu-btn{display:grid}
}
@media (max-width:560px){.brand .acad,.hide-sm{display:none!important}.brand img{height:34px}.top .wrap{gap:10px}}

/* hero */
.hero{background:radial-gradient(900px 380px at 88% -10%,rgba(23,138,255,.5),transparent 60%),linear-gradient(160deg,var(--hero),var(--hero-2));color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;padding-block:64px 60px;align-items:center}
.hero .tagline{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:500;font-size:.9rem;color:rgba(255,255,255,.8)}
.hero .tagline b{background:#178AFF;color:#fff;padding:2px 9px;font-weight:600}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.8rem);font-weight:700;letter-spacing:-.025em;margin-top:16px}
.hero h1 .dot{color:#3D9DFF}
.hero p.lead{font-size:1.12rem;max-width:34em;margin-top:16px;color:rgba(255,255,255,.82)}
.searchbar{display:flex;gap:8px;margin-top:26px;background:#fff;border-radius:12px;padding:6px;max-width:520px}
.searchbar input{flex:1;min-width:0;border:0;background:none;padding:8px 10px;color:#0B1B2E;outline:0}
.trust{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;color:rgba(255,255,255,.85);font-size:.92rem;align-items:center}
.trust b{font-family:var(--f-display);color:#fff}
.stars{color:#FFC93C;letter-spacing:1px}
.faces{display:flex}.faces i{width:30px;height:30px;border-radius:50%;border:2px solid var(--hero);margin-left:-8px;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700;background:#178AFF}
.faces i:first-child{margin-left:0}.faces i:nth-child(2){background:#fff;color:#014689}.faces i:nth-child(3){background:#5AA9FF}
.tree-title{font-family:var(--f-display);font-weight:600;text-align:center;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.tree-svg{display:block;width:100%;height:34px}
.tree-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tree-node{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;color:#fff;transition:background .2s}
.tree-node:hover{background:rgba(255,255,255,.15)}
.tree-node .ic{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;color:#014689;display:grid;place-items:center}
.tree-node small{display:block;color:rgba(255,255,255,.7);font-size:.78rem}
.tree-node strong{font-family:var(--f-display);font-weight:600;font-size:.95rem}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;padding-block:44px}}
@media (max-width:420px){.tree-grid{grid-template-columns:1fr}}

.stats{background:var(--surface);border-bottom:1px solid var(--line)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:24px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--f-display);font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--ink-2);font-size:.9rem}
@media (max-width:700px){.stats .wrap{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

section.block{padding-block:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.6rem,3vw,2.25rem);margin-top:6px}
.sec-head p{max-width:36em}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:0}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;transition:border-color .2s,transform .2s}
.cat:hover{border-color:var(--blue);transform:translateY(-2px)}
.cat .ic{width:50px;height:50px;border-radius:12px;background:var(--blue-soft);color:var(--navy);display:grid;place-items:center;flex:none}
.cat strong{font-family:var(--f-display);font-weight:600;display:block}
.cat small{color:var(--ink-2)}

/* partners offers */
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:center}
.offer .plogo{width:84px;height:84px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;padding:10px;font-family:var(--f-display);font-weight:700;color:var(--navy);text-align:center;font-size:.85rem;overflow:hidden}
.offer .plogo img{max-width:100%;max-height:100%;object-fit:contain}
.offer h3{font-size:1.05rem}
.offer p{color:var(--ink-2);font-size:.92rem;margin-top:4px}
.logo-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.logo-strip div{background:var(--surface);border:1px solid var(--line);border-radius:12px;height:84px;display:grid;place-items:center;padding:12px}
.logo-strip img{max-height:48px;max-width:100%;object-fit:contain}

/* course cards */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--surface);border:1.5px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.88rem;color:var(--ink-2);font-weight:500}
.tabs button.on{background:#014689;border-color:#014689;color:#fff}
.filterbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.sel{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cover{aspect-ratio:16/9;max-width:100%;background:linear-gradient(140deg,var(--cover-a),var(--cover-b));position:relative;display:grid;place-items:center;color:#fff;overflow:hidden}
.cover img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ic-big{width:64px;height:64px;border-radius:16px;background:#fff;color:#014689;display:grid;place-items:center}
.cover .ghost{position:absolute;right:-10px;bottom:-26px;font-family:var(--f-display);font-weight:700;font-size:5.5rem;color:rgba(255,255,255,.08);line-height:1}
.badge{position:absolute;top:12px;font-size:.74rem;font-weight:700;padding:4px 9px;border-radius:6px}
.badge.off{right:12px;background:#fff;color:#B91C1C}
.badge.free{right:12px;background:#15803D;color:#fff}
.badge.lvl{left:12px;background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.ccard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ccard .catlbl{font-size:.78rem;color:var(--blue);font-weight:600;letter-spacing:.02em}
.ccard h3{font-size:1.12rem}
.ccard .meta{display:flex;gap:12px;color:var(--ink-2);font-size:.84rem;flex-wrap:wrap}
.ccard .meta span{display:inline-flex;align-items:center;gap:4px}
.ccard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);gap:8px}
.price{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--navy);font-variant-numeric:tabular-nums}
.price s{font-size:.85rem;color:var(--ink-2);font-weight:500;margin-left:6px}
.rating{color:var(--gold);font-size:.85rem;font-weight:600}

/* achievers */
.achievers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--blue-soft);color:var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.ach small{display:block;color:var(--ink-2);font-size:.84rem}
.ach .cert{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--ok);background:var(--ok-bg);padding:3px 7px;border-radius:6px;white-space:nowrap}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.tcard .ph{aspect-ratio:4/3;max-width:100%;background:linear-gradient(160deg,var(--blue-soft),var(--surface-2));display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:2.6rem;color:var(--navy);overflow:hidden;position:relative}
.tcard .ph img{width:100%;height:100%;object-fit:cover}
.tcard .ph .tagf{position:absolute;left:12px;top:12px;background:#178AFF;color:#fff;font-size:.72rem;font-weight:600;padding:3px 9px;font-family:var(--f-body)}
.tcard .tb{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.tcard .role{color:var(--blue);font-weight:600;font-size:.86rem}
.tcard p{color:var(--ink-2);font-size:.92rem}

/* reviews */
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.rev .who{display:flex;gap:10px;align-items:center}
.rev .who small{display:block;color:var(--ink-2);font-size:.82rem}
.rev .on{font-size:.84rem;color:var(--blue);font-weight:600}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}

/* app/cta */
.cta-band{background:linear-gradient(160deg,var(--hero),var(--hero-2));color:#fff;border-radius:20px;padding:40px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.cta-band h2{font-size:clamp(1.5rem,3vw,2.1rem)}
.cta-band p{color:rgba(255,255,255,.8);margin-top:10px}
.phones{display:flex;flex-direction:column;gap:10px}
.phone{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 8px 8px 20px;font-family:var(--f-mono)}
.phone button{background:#fff;color:#014689;border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-family:var(--f-body);font-size:.85rem}
@media (max-width:760px){.cta-band{grid-template-columns:1fr;padding:28px 20px}}

footer.site{background:var(--surface);border-top:1px solid var(--line);margin-top:64px}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px;padding-block:44px 28px}
footer.site h4{font-size:.95rem;margin-bottom:12px}
footer.site ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
footer.site li button{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;text-align:left}
footer.site li button:hover{color:var(--blue)}
footer.site .pay{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
footer.site .pay span{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
footer.site .bottom{border-top:1px solid var(--line);padding-block:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:.88rem}
@media (max-width:820px){footer.site .cols{grid-template-columns:1fr 1fr}}
@media (max-width:480px){footer.site .cols{grid-template-columns:1fr}}

/* course detail */
.dhero{background:linear-gradient(160deg,var(--hero),var(--hero-2));color:#fff}
.dhero .wrap{padding-block:36px 40px}
.dhero h1{font-size:clamp(1.8rem,4vw,2.7rem);margin-top:10px;max-width:22em}
.dhero p{color:rgba(255,255,255,.82);margin-top:12px;max-width:42em}
.dhero .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:.92rem;color:rgba(255,255,255,.85)}
.back{background:none;border:0;cursor:pointer;padding:0;font-weight:500;color:inherit;opacity:.85}
.back:hover{opacity:1}
.detail{display:grid;grid-template-columns:1fr 360px;gap:32px;padding-block:32px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:1.05rem}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px}
.outcomes div{display:flex;gap:8px;font-size:.94rem}
.outcomes div::before{content:"✓";color:var(--ok);font-weight:700}
@media (max-width:560px){.outcomes{grid-template-columns:1fr}}
.lesson{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:default}
.lesson:last-child{border-bottom:0}
.lesson.open{cursor:pointer}.lesson.open:hover{background:var(--surface-2)}
.lesson.cur{background:var(--blue-soft)}
.lesson .ln{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2);width:26px;flex:none}
.lesson .lt{flex:1;min-width:0}

.hero{position:relative;isolation:isolate}

.hero .tagline b{border-radius:6px;padding:3px 10px}
.hero h1{color:#0B1B2E;font-size:clamp(2.4rem,5vw,4rem);line-height:1.06;letter-spacing:-.03em;margin-top:20px;font-weight:700}
.hero h1 .grad{background:linear-gradient(90deg,#014689,#178AFF);-webkit-background-clip:text;background-clip:text;color:transparent;animation:none}
.hero h1 .dot{color:#178AFF}
.hero p.lead{color:#4A5A6E;font-size:1.1rem;max-width:30em;margin-top:22px;line-height:1.65}
.hero-cta{margin-top:32px;gap:12px}
.hero .btn{padding:13px 24px;border-radius:12px;font-size:.98rem}
.hero .btn-navy{background:#014689}
.hero .btn-ghost{background:#fff;color:#014689;border-color:#D6E2F0}
.hero .btn-ghost:hover{border-color:#178AFF;color:#178AFF}
.hero .trust{margin-top:36px;padding-top:24px;border-top:1px solid #D6E2F0;color:#4A5A6E;gap:24px}
.hero .trust b{color:#014689}
.hero .faces i{border-color:#F7FAFD}

.hero-art{position:relative;min-width:0}
.hero-frame{position:relative;border-radius:28px;overflow:hidden;background:#dbe7f5;box-shadow:0 40px 80px -30px rgba(1,40,90,.35),0 0 0 1px rgba(1,40,90,.06)}
.hero-photo{display:block;width:100%;height:auto;aspect-ratio:4/4.4;object-fit:cover;object-position:50% 20%;max-width:100%}
.hero-photo.own{border-radius:0;margin:0;-webkit-mask-image:none;mask-image:none}
.hero .float.f1{left:-18px;bottom:36px;top:auto;right:auto;background:#fff;border:1px solid #E1EAF5;box-shadow:0 18px 40px -12px rgba(1,40,90,.25);border-radius:16px;padding:12px 16px;animation:bob 7s ease-in-out infinite}
.hero .float.f1 .fi{width:40px;height:40px;border-radius:12px;background:#014689}
.hero .float.f1 b{font-size:.98rem;color:#0B1B2E}
.hero .float.f1 small{color:#6B7C92}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:44px 24px}.hero-art{max-width:560px;width:100%;margin:0 auto}}
@media (max-width:520px){.hero-frame{border-radius:20px}.hero .float.f1{left:10px;bottom:12px}.hero h1{font-size:2.3rem}}

/* quieter stripes behind the page header area too */
.hero-search{margin-top:-30px}

/* ===== Gradient accents ===== */
:root{--grad-brand:linear-gradient(135deg,#014689 0%,#0B6FD6 55%,#178AFF 100%);--grad-soft:linear-gradient(180deg,#F7FAFD 0%,#E3F0FF 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grad-brand:linear-gradient(135deg,#073A72 0%,#1772D6 60%,#3D9DFF 100%);--grad-soft:linear-gradient(180deg,#0D1A2C 0%,#11294A 100%)}}
:root[data-theme="dark"]{--grad-brand:linear-gradient(135deg,#073A72 0%,#1772D6 60%,#3D9DFF 100%);--grad-soft:linear-gradient(180deg,#0D1A2C 0%,#11294A 100%)}

.btn-primary,.sale button,.userchip i{background:var(--grad-brand)!important;color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-navy{background:var(--grad-brand)!important}
.sale{background:var(--grad-brand)!important}
.sale button{color:#014689!important;background:#fff!important}
.stat b,.price{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{background:var(--grad-soft)}
.phead{background:var(--grad-soft)}
.eyebrow{color:#0B6FD6}
.eyebrow::before{background:var(--grad-brand)}
.tabs button.on,.filters button.on{background:var(--grad-brand)!important;border-color:transparent!important;color:#fff!important}
.cta-band{background:var(--grad-brand)!important}
.ccard .cover,.cover{background:var(--grad-brand)!important}
.mrow .ic,.kpi b,.progress i,.bar-row .track i{background:var(--grad-brand)}
.kpi b{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.tcard .ph{background:var(--grad-soft)}
.hero-frame{background:var(--grad-soft)}
.hero h1 .grad{color:#0B6FD6!important;background:none!important;-webkit-text-fill-color:#0B6FD6}
.hero .btn-navy{background:var(--grad-brand)!important}
.trust .faces i:nth-child(1){background:var(--grad-brand)}
.chip,.tree-node .ic{background:var(--grad-soft)}
</style>

function renderCatalog(){
  const pub=published();
  const q=query.toLowerCase();
  const list=pub.filter(c=>(catFilter==="all"||c.cat===catFilter)&&(lvlFilter==="all"||c.level===lvlFilter)&&(!q||(c.title+" "+c.desc).toLowerCase().includes(q)));
  return `<div class="wrap" style="padding-block:40px">
    <div class="sec-head"><div><span class="eyebrow">Courses</span><h2>All courses<span class="dot">.</span></h2></div>
    <input class="search" id="cq" placeholder="Search courses…" value="${esc(query)}" aria-label="Search courses"></div>
    <div class="filterbar"><div class="tabs"><button class="${catFilter==="all"?"on":""}" data-cat="all">All</button>${S.categories.map(k=>`<button class="${catFilter===k.id?"on":""}" data-cat="${k.id}">${esc(k.name)}</button>`).join("")}</div>

function renderCourse(){
  const c=course(view.id);if(!c)return renderHome();
  const e=enrFor(c.id),open=e&&e.status==="approved",k=cat(c.cat),t=S.team[c.teacher],r=courseRating(c.id);
  let box;
  if(open)box=`<span class="pill approved">You are enrolled</span><button class="btn btn-primary" data-learn="${c.id}">Continue learning</button>`;
  else if(e)box=`<span class="pill pending">Payment under review</span><p class="muted" style="font-size:.9rem">We received transaction <b class="mono">${esc(e.tx)}</b>. Your lessons unlock as soon as an admin confirms it.</p>`;
  else box=`<button class="btn btn-primary" data-enroll="${c.id}">${Number(c.price)===0?"Start for free":"Buy this course"}</button><p class="muted" style="font-size:.82rem;text-align:center">Sahal · EVC Plus · eDahab · Zaad · WaafiPay</p>`;
  return `<section class="dhero"><div class="wrap">
      <button class="back" data-go="catalog">← All courses</button>
      <div style="margin-top:14px;max-width:calc(100% - 0px)"><span class="eyebrow" style="color:#7DBBFF">${esc(k?k.name:"")}</span><h1>${esc(c.title)}<span style="color:#3D9DFF">.</span></h1><p>${esc(c.desc)}</p>
      <div class="meta"><span>${I("book",16)} ${c.lessons.length} lessons</span><span>${I("clock",16)} ${dur(c)}</span><span>Level: ${esc(c.level)}</span>${r?`<span class="stars">★ ${r.avg.toFixed(1)} (${r.n})</span>`:""}${t?`<span>Instructor: ${esc(t.name)}</span>`:""}</div></div>
    </div></section>
    <div class="wrap"><div class="detail">
    <div style="min-width:0;display:flex;flex-direction:column;gap:20px">
      <div class="card"><div class="card-h"><h3>What you will learn</h3></div><div class="outcomes">${c.outcomes.map(o=>`<div>${esc(o)}</div>`).join("")}</div></div>
      <div class="card"><div class="card-h"><h3>Course curriculum</h3><span class="muted num" style="font-size:.86rem">${c.lessons.length} lessons · ${dur(c)}</span></div>
      ${c.lessons.map((l,i)=>{const done=e&&e.progress.includes(i);const canOpen=open||i===0;return `<button class="lesson ${canOpen?"open":""} ${done?"done":""}" ${canOpen?`data-lesson="${c.id}:${i}"`:"disabled"}><span class="ln">${String(i+1).padStart(2,"0")}</span><span class="lt">${esc(l[0])}</span>${!open&&i===0?`<span class="prev">Preview</span>`:""}<span class="ld">${esc(l[1])}</span><span class="lk">${done?I("check",18):canOpen?I("play",18):I("lock",18)}</span></button>`}).join("")}</div>
      ${t?`<div class="card"><div class="card-h"><h3>Instructor</h3></div><div class="instr"><span class="av" style="width:60px;height:60px">${t.photo?`<img src="${esc(t.photo)}" alt="">`:esc(initials(t.name))}</span><div><b>${esc(t.name)}</b><div class="muted" style="font-size:.9rem">${esc(t.role)}</div></div></div></div>`:""}
    </div>
    <aside class="buybox card">${coverHTML(c)}<div class="inner">
      ${priceHTML(c)}${saleOn()&&Number(c.price)>0?`<span class="muted" style="font-size:.85rem;margin-top:-8px">Sale ends ${esc(S.settings.sale.ends)}</span>`:""}

function renderStudent(){
  const u=me();

  let body="";
  const row=e=>{const c=course(e.course);if(!c)return"";const pct=Math.round(e.progress.length/Math.max(1,c.lessons.length)*100);
    return `<div class="mrow">${coverHTML(c,{badges:false})}<div class="info"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="font-size:1.05rem">${esc(c.title)}</h3><span class="pill ${e.status}">${e.status==="approved"?"Active":e.status==="pending"?"Awaiting confirmation":"Rejected"}</span></div>
    ${e.status==="approved"?`<div class="progress"><i style="width:${pct}%"></i></div><span class="muted num" style="font-size:.85rem">${pct}% · ${e.progress.length}/${c.lessons.length} lessons</span>`:e.status==="pending"?`<span class="muted" style="font-size:.88rem">Transaction <span class="mono">${esc(e.tx)}</span> (${esc(e.method)}) is being reviewed.</span>`:`<span class="muted" style="font-size:.88rem">This payment was not confirmed. Contact us on ${esc(S.settings.payNumber)}.</span>`}</div>
    <div class="act">${e.status==="approved"?(isComplete(e)?`<button class="btn btn-ghost btn-sm" data-stab="certs">Certificate</button>`:`<button class="btn btn-primary btn-sm" data-learn="${c.id}">${e.progress.length?"Continue":"Start"}</button>`):`<button class="btn btn-ghost btn-sm" data-course="${c.id}">View</button>`}</div></div>`};
  if(tab==="dash"){
    const done=ap.filter(isComplete).length,lessonsDone=ap.reduce((a,e)=>a+e.progress.length,0);
    const cont=ap.find(e=>!isComplete(e));
    body=`<div class="ahead"><div><span class="eyebrow">Dashboard</span><h2>Welcome back, ${esc(u.name.split(" ")[0])}<span class="dot">.</span></h2></div><button class="btn btn-primary btn-sm" data-go="catalog">+ New course</button></div>
    <div class="kpis"><div class="kpi"><span>Active courses</span><b>${ap.length}</b></div><div class="kpi"><span>Lessons completed</span><b>${lessonsDone}</b></div><div class="kpi"><span>Certificates</span><b>${done}</b></div><div class="kpi ${list.some(e=>e.status==="pending")?"warn":""}"><span>Awaiting confirmation</span><b>${list.filter(e=>e.status==="pending").length}</b></div></div>
    ${cont?`<h3 style="margin-top:28px;font-size:1.05rem">Pick up where you left off</h3>${row(cont)}`:""}
    <h3 style="margin-top:28px;font-size:1.05rem">All your courses</h3>
    ${list.length?list.map(row).join(""):`<div class="empty" style="margin-top:14px"><p>You have not enrolled in a course yet.</p><button class="btn btn-primary" data-go="catalog">Browse courses</button></div>`}`;
  }
  if(tab==="courses")body=`<div class="ahead"><h2>My courses</h2></div>${list.length?list.map(row).join(""):`<div class="empty" style="margin-top:14px"><p>You have not enrolled in a course yet.</p><button class="btn btn-primary" data-go="catalog">Browse courses</button></div>`}`;
  if(tab==="certs"){
    const certs=ap.filter(isComplete);
    certs.forEach(e=>{if(!e.cert){e.cert="XW-"+new Date().getFullYear()+"-"+String(Math.floor(1000+Math.random()*9000));save()}});
    body=`<div class="ahead"><h2>Certificates</h2></div><p class="muted" style="margin-top:6px">Every certificate has a unique ID that anyone can check with "Verify certificate".</p>
    ${certs.length?`<div style="display:flex;flex-direction:column;gap:20px;margin-top:20px">${certs.map(e=>certHTML(e)).join("")}</div>`:`<div class="empty" style="margin-top:16px"><p>Complete every lesson in a course to earn a certificate.</p></div>`}
    ${certs.length?reviewPrompt(certs):""}`;
  }
  if(tab==="profile")body=`<div class="ahead"><h2>Profile</h2></div><div class="panel" style="max-width:560px"><form id="profileForm" style="padding:18px">
    <div class="field"><label for="pfn">Full name</label><input id="pfn" value="${esc(u.name)}" required></div>
    <div class="field"><label for="pfp">Phone</label><input id="pfp" value="${esc(u.phone)}" disabled></div>
    <div class="field"><label for="pfe">Email</label><input id="pfe" type="email" value="${esc(u.email)}"></div>
    <div class="field"><label for="pfw">New password</label><input id="pfw" type="password" placeholder="Leave blank to keep your current password"></div>
    <div class="actions" style="justify-content:space-between"><button type="button" class="btn btn-bad btn-sm" id="logout">Log out</button><button class="btn btn-primary" type="submit">Save changes</button></div></form></div>`;
  return `<div class="shell"><nav class="aside"><span class="lbl">My account</span>${items.map(([k,l,i])=>`<button class="${tab===k?"on":""}" data-stab="${k}">${I(i,18)} ${l}</button>`).join("")}<span class="lbl">Explore</span><button data-go="catalog">${I("grid",18)} All courses</button></nav><div class="amain">${body}</div></div>`;
}

function reviewPrompt(certs){
  const pending=certs.filter(e=>!S.reviews.some(r=>r.user===e.user&&r.course===e.course));
  if(!pending.length)return "";
  return `<div class="panel" style="max-width:640px"><div class="panel-h"><h3>Review your course</h3></div><form id="reviewForm" style="padding:18px">
  <div class="field"><label for="rvc">Course</label><select id="rvc">${pending.map(e=>`<option value="${e.course}">${esc(course(e.course)?.title)}</option>`).join("")}</select></div>
  <div class="field"><label>Rating</label><div class="starpick" id="starpick">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" class="on" aria-label="${n} stars">★</button>`).join("")}</div></div>
  <div class="field"><label for="rvt">Your review</label><textarea id="rvt" rows="3" required placeholder="How did this course help you?"></textarea></div>
  <div class="actions"><button class="btn btn-primary" type="submit">Submit review</button></div></form></div>`}
let starVal=5;

function renderLesson(){
  const [cid,i]=view.lesson.split(":");const c=course(cid);const e=enrFor(cid);const idx=Number(i);
  const open=e&&e.status==="approved";
  if(!c||(!open&&idx!==0))return renderCourse();
  const l=c.lessons[idx];const done=open&&e.progress.includes(idx);
  return `<div class="wrap" style="padding-block:28px"><button class="back" style="color:var(--ink-2)" data-course="${c.id}">← ${esc(c.title)}</button>
    <div class="detail" style="padding-top:16px">
    <div style="min-width:0"><div class="player"><div><div class="play">${I("play",28)}</div><h3 style="font-size:1.25rem">${esc(l[0])}</h3><p style="opacity:.8;margin-top:6px">Lesson ${idx+1} of ${c.lessons.length} · ${esc(l[1])}</p>${l[2]?`<a class="btn btn-light btn-sm" style="margin-top:14px" href="${esc(l[2])}" target="_blank" rel="noopener">Watch the video</a>`:`<p style="opacity:.7;font-size:.86rem;margin-top:12px">The video link is added by an admin (Admin → Courses).</p>`}</div></div>
    ${open?`<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">${idx>0?`<button class="btn btn-ghost" data-lesson="${cid}:${idx-1}">← Previous</button>`:""}<button class="btn ${done?"btn-ghost":"btn-primary"}" data-done="${cid}:${idx}">${done?"Completed ✓":"Mark as complete"}</button>${idx<c.lessons.length-1?`<button class="btn btn-ghost" data-lesson="${cid}:${idx+1}">Next →</button>`:""}</div>`
    :`<div class="note" style="background:var(--blue-soft);color:var(--ink)">This is a free preview lesson. Buy the course to unlock ${c.lessons.length-1} more lessons. <button class="btn btn-primary btn-sm" style="margin-left:8px" data-enroll="${c.id}">Buy course</button></div>`}</div>
    <aside class="card" style="align-self:start"><div class="card-h"><h3>Your progress</h3>${open?`<span class="muted num">${e.progress.length}/${c.lessons.length}</span>`:""}</div>${open?`<div style="padding:12px 20px 4px"><div class="progress"><i style="width:${Math.round(e.progress.length/c.lessons.length*100)}%"></i></div></div>`:""}

function monthly(){
  const m={};S.enrollments.filter(e=>e.status==="approved").forEach(e=>{const k=e.date.slice(0,7);m[k]=(m[k]||0)+Number(e.amount||0)});
  const out=[];const d=new Date();for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");out.push([k,m[k]||0])}return out;
}
function revenueChart(){
  const data=monthly(),W=560,H=200,pl=44,pb=26,pt=14,max=Math.max(50,...data.map(d=>d[1]));const step=Math.ceil(max/4/10)*10;const top=step*4;
  const bw=(W-pl-10)/data.length;const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let g="";for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?"3 4":"0"}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${S.settings.currency}${step*i}</text>`}
  data.forEach(([k,v],i)=>{const h=(H-pt-pb)*v/top;const x=pl+i*bw+bw*.22;const last=i===data.length-1;g+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.56}" height="${Math.max(h,0)}" rx="5" fill="${last?"var(--blue)":"var(--navy)"}" opacity="${last?1:.75}"><title>${k}: ${money(v)}</title></rect>${v?`<text x="${x+bw*.28}" y="${H-pb-h-6}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${money(v)}</text>`:""}<text x="${x+bw*.28}" y="${H-8}" text-anchor="middle">${months[+k.slice(5)-1]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly revenue">${g}</svg>`;
}

function actions(e){return e.status==="pending"?`<button class="btn btn-ok btn-sm" data-approve="${e.id}">Confirm & unlock</button><button class="btn btn-bad btn-sm" data-reject="${e.id}">Reject</button>`:e.status==="approved"?`<button class="btn btn-ghost btn-sm" data-revoke="${e.id}">Lock</button>`:`<button class="btn btn-ghost btn-sm" data-approve="${e.id}">Unlock</button>`}
function payRow(e){const u=user(e.user),c=course(e.course);return `<tr><td><b>${esc(u?.name)}</b><div class="sub mono">${esc(u?.phone)}</div></td><td>${esc(c?.title||"—")}</td><td class="num">${money(e.amount)}</td><td class="num">${esc(e.date)}</td><td>${pill(e)}</td><td><div class="tact">${actions(e)}</div></td></tr>`}
function payRowFull(e){const u=user(e.user),c=course(e.course);return `<tr><td><b>${esc(u?.name)}</b><div class="sub mono">${esc(u?.phone)}</div></td><td>${esc(c?.title||"—")}</td><td class="mono">${esc(e.tx)}<div class="sub" style="font-family:var(--f-body)">${esc(e.method)} · ${money(e.amount)}</div></td><td class="num">${esc(e.date)}</td><td>${pill(e)}</td><td><div class="tact">${actions(e)}</div></td></tr>`}

/* ---------- MODALS ---------- */
function closeModal(){$("#modalRoot").innerHTML=""}
function modal(html){$("#modalRoot").innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$("#modalRoot input:not([disabled]),#modalRoot select");f&&f.focus()}
function openAuth(mode,after){
  modal(`<button class="x" data-close aria-label="Close">×</button><h3>${mode==="login"?"Log in to your account":"Create your account"}</h3><p class="muted">Xirfad Wadaag Academy</p>
  <div class="switch"><button type="button" class="${mode==="login"?"on":""}" data-authswitch="login">Log in</button><button type="button" class="${mode==="signup"?"on":""}" data-authswitch="signup">Sign up</button></div>
  <form id="authForm">${mode==="signup"?`<div class="field"><label for="an">Full name</label><input id="an" required autocomplete="name"></div>`:""}
  <div class="field"><label for="ap">Phone number (WhatsApp)</label><input id="ap" required inputmode="tel" placeholder="+2529…" autocomplete="tel"></div>
  ${mode==="signup"?`<div class="field"><label for="ae">Email (optional)</label><input id="ae" type="email" autocomplete="email"></div>`:""}
  <div class="field"><label for="aw">Password</label><input id="aw" type="password" required minlength="4" autocomplete="${mode==="login"?"current-password":"new-password"}"></div>
  <div class="err" id="aerr" hidden></div>
  ${mode==="login"?`<p class="hint muted" style="font-size:.8rem;margin-top:8px">Demo: +252907111222 · password 1234</p>`:""}
  <div class="actions"><button class="btn btn-primary" type="submit" style="width:100%">${mode==="login"?"Log in":"Create account"}</button></div></form>`);
  $("#modalRoot").dataset.after=after||"";
  $("#authForm").onsubmit=ev=>{ev.preventDefault();const phone=$("#ap").value.replace(/\s+/g,""),pw=$("#aw").value,err=$("#aerr");
    if(mode==="login"){const u=S.users.find(x=>x.phone===phone);if(!u||u.pass!==pw){err.textContent="That phone number or password is incorrect.";err.hidden=false;return}setMe(u.id)}
    else{if(S.users.some(x=>x.phone===phone)){err.textContent="This number is already registered. Log in instead.";err.hidden=false;return}
      const u={id:"u"+Date.now(),name:$("#an").value.trim(),phone,email:$("#ae").value.trim(),pass:pw,joined:today()};S.users.push(u);save();setMe(u.id)}
    closeModal();renderChrome();toast(mode==="login"?"You are logged in":"Your account is ready");
    if(after)openEnroll(after);else go("student")};
}
function openEnroll(cid){
  const c=course(cid);if(!me())return openAuth("signup",cid);
  const price=finalPrice(c);
  if(price===0){S.enrollments.push({id:"e"+Date.now(),user:meId,course:cid,method:"Free",tx:"—",amount:0,status:"approved",date:today(),progress:[],cert:""});save();toast("Course unlocked");return go("student",{lesson:cid+":0"})}
  modal(`<button class="x" data-close aria-label="Close">×</button><h3>Complete your payment</h3><p class="muted">Send the amount to the number below, then enter your transaction ID.</p><div class="stepper"><i class="on"></i><i class="on"></i></div>
  <div class="paybox"><div class="row"><span>Course</span><b style="font-family:var(--f-body);font-weight:600">${esc(c.title)}</b></div><div class="row"><span>Amount</span><b>${money(price)}${price<c.price?` <s style="opacity:.6">${money(c.price)}</s>`:""}</b></div><div class="row"><span>Send to</span><b>${esc(S.settings.payNumber)}</b></div></div>
  <div class="field"><label>Pay now from your phone</label><div class="methods" style="grid-template-columns:repeat(3,1fr)">
  <a class="btn btn-ghost btn-sm" href="tel:*883*0905842102*${Math.round(price)}%23" style="justify-content:center">Sahal</a>
  <a class="btn btn-ghost btn-sm" href="tel:*113*842102*${Math.round(price)}%23" style="justify-content:center">Somtel</a>
  <a class="btn btn-ghost btn-sm" href="tel:*789*5842102*${Math.round(price)}%23" style="justify-content:center">EVC Plus</a></div>
  <span class="hint">Tap your provider. Your phone dialer opens with the payment code filled in. Press call, then enter the transaction ID below.</span></div>
  <form id="payForm"><div class="field"><label>Payment method</label><div class="methods">${["Sahal","EVC Plus","eDahab","Zaad"].map((m,i)=>`<label><input type="radio" name="pm" value="${m}" ${i===0?"checked":""}> ${m}</label>`).join("")}</div></div>
  <div class="field"><label for="etx">Transaction ID</label><input id="etx" required placeholder="e.g. SH8392017" class="mono"><span class="hint">You receive it by SMS after sending the payment.</span></div>
  <div class="actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" type="submit">Submit payment</button></div></form>`);
  $("#payForm").onsubmit=ev=>{ev.preventDefault();
    S.enrollments.push({id:"e"+Date.now(),user:meId,course:cid,method:document.querySelector('input[name=pm]:checked').value,tx:$("#etx").value.trim(),amount:price,status:"pending",date:today(),progress:[],cert:""});
    save();closeModal();toast("Payment submitted. Your lessons unlock once it is confirmed.");go("student")};
}
function openVerify(){
  modal(`<button class="x" data-close aria-label="Close">×</button><h3>Verify a certificate</h3><p class="muted">Enter a certificate ID to check that it is genuine.</p>
  <form id="verifyForm"><div class="field"><label for="vid">Certificate ID</label><input id="vid" required placeholder="XW-2026-0000" class="mono"></div><div id="vres"></div>
  <div class="actions"><button class="btn btn-primary" type="submit">Verify</button></div></form>`);
  $("#verifyForm").onsubmit=ev=>{ev.preventDefault();const id=$("#vid").value.trim().toUpperCase();const e=S.enrollments.find(x=>x.cert&&x.cert.toUpperCase()===id);
    $("#vres").innerHTML=e?`<div class="paybox" style="background:var(--ok-bg)"><b style="color:var(--ok)">✓ Valid certificate</b><div class="row"><span>Student</span><b style="font-family:var(--f-body)">${esc(user(e.user)?.name)}</b></div><div class="row"><span>Course</span><b style="font-family:var(--f-body)">${esc(course(e.course)?.title)}</b></div></div>`:`<div class="err">No certificate was found with that ID.</div>`};
}
function openGrant(uid){
  const u=user(uid);
  modal(`<button class="x" data-close aria-label="Close">×</button><h3>Give course access</h3><p class="muted">${esc(u.name)} · for example, a cash payment made at the office.</p>
  <form id="grantForm"><div class="field"><label for="gc">Course</label><select id="gc">${S.courses.map(c=>`<option value="${c.id}">${esc(c.title)} · ${money(finalPrice(c))}</option>`).join("")}</select></div>
  <div class="field"><label for="gm">Method</label><select id="gm"><option>Cash</option><option>Sahal</option><option>EVC Plus</option><option>eDahab</option><option>Zaad</option><option>Free (scholarship)</option></select></div>
  <div class="actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" type="submit">Unlock course</button></div></form>`);
  $("#grantForm").onsubmit=ev=>{ev.preventDefault();const cid=$("#gc").value,m=$("#gm").value;
    S.enrollments.push({id:"e"+Date.now(),user:uid,course:cid,method:m,tx:"ADMIN",amount:m.startsWith("Free")?0:finalPrice(course(cid)),status:"approved",date:today(),progress:[],cert:""});save();closeModal();toast("Course unlocked for "+u.name.split(" ")[0]);render()};
}

function render(){
  renderChrome();
  const n=view.name;
  $("#app").innerHTML=n==="course"?renderCourse():n==="catalog"?renderCatalog():n==="instructors"?renderInstructors():n==="partners"?renderPartners():n==="verify"?renderVerify():n==="student"?renderStudent():n==="admin"?renderAdmin():renderHome();
  if(n!=="admin"&&n!=="student")$("#app").insertAdjacentHTML("beforeend",footer());
  $$("nav.links button").forEach(b=>b.classList.toggle("on",b.dataset.go===n&&n!=="home"));
  const vp=$("#verifyPage");if(vp)vp.onsubmit=ev=>{ev.preventDefault();view.cert=$("#vpid").value.trim();render()};
  document.querySelectorAll("[data-count]").forEach(el=>{const end=+el.dataset.count;if(!end||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const txt=el.textContent,suffix=txt.replace(/[0-9,.]/g,"");const t0=performance.now(),dur=900;
    const step=now=>{const p=Math.min(1,(now-t0)/dur),v=Math.round(end*(1-Math.pow(1-p,3)));el.textContent=v.toLocaleString()+suffix;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
  const pf=$("#pinForm");if(pf)pf.onsubmit=ev=>{ev.preventDefault();if($("#pin").value===String(S.settings.adminPin)){adminOK=true;render()}else $("#pinErr").hidden=false};
  const sq=$("#sq");if(sq)sq.oninput=()=>{view.q=sq.value;const p=sq.selectionStart;render();const x=$("#sq");x.focus();x.setSelectionRange(p,p)};
  const cq=$("#cq");if(cq)cq.oninput=()=>{query=cq.value;const p=cq.selectionStart;render();const x=$("#cq");x.focus();x.setSelectionRange(p,p)};
  const lv=$("#lvl");if(lv)lv.onchange=()=>{lvlFilter=lv.value;render()};
  const hs=$("#heroSearch");if(hs)hs.onsubmit=ev=>{ev.preventDefault();query=$("#hq").value.trim();catFilter="all";go("catalog")};
  const pfm=$("#partnerForm");if(pfm)pfm.onsubmit=ev=>{ev.preventDefault();const name=$("#pn").value.trim(),offer=$("#po").value.trim(),file=$("#pl").files[0];
    const add=logo=>{S.partners.push({name,offer,logo});save();toast("Partner added");render()};file?readImg(file,add,600):add("")};
  const cf=$("#catForm");if(cf)cf.onsubmit=ev=>{ev.preventDefault();S.categories.push({id:"k"+Date.now(),name:$("#catn").value.trim(),icon:$("#cati").value});save();render()};
  const prf=$("#profileForm");if(prf)prf.onsubmit=ev=>{ev.preventDefault();const u=me();u.name=$("#pfn").value.trim();u.email=$("#pfe").value.trim();if($("#pfw").value)u.pass=$("#pfw").value;save();toast("Profile saved");render()};
  const rf=$("#reviewForm");if(rf){starVal=5;rf.onsubmit=ev=>{ev.preventDefault();S.reviews.push({id:"r"+Date.now(),user:meId,course:$("#rvc").value,rating:starVal,text:$("#rvt").value.trim(),date:today(),status:"pending"});save();toast("Thank you! Your review will appear once it is approved.");render()}}
  $$("form[data-addlesson]").forEach(f=>f.onsubmit=ev=>{ev.preventDefault();const ci=+f.dataset.addlesson;const fd=new FormData(f);S.courses[ci].lessons.push([fd.get("t").trim(),fd.get("d").trim()||"15:00",fd.get("u").trim()]);save();render()});
}
function readImg(file,cb,max=800){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  const png=/png|svg/.test(file.type);cb(cv.toDataURL(png?"image/png":"image/jpeg",.85))};img.onerror=()=>toast("That image could not be read");img.src=r.result};r.readAsDataURL(file)}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");
  if(!t){if(ev.target.id==="mbg")closeModal();return}
  const d=t.dataset;
  if("close" in d)return closeModal();
  if(d.go)return go(d.go);
  if(d.scroll)return scrollToId(d.scroll);
  if("verify" in d)return go("verify");
  if(d.auth)return openAuth(d.auth);
  if(d.authswitch)return openAuth(d.authswitch,$("#modalRoot").dataset.after);
  if(d.cat){catFilter=d.cat;query="";return go("catalog")}
  if(d.course)return go("course",{id:d.course});
  if(d.learn){const e=enrFor(d.learn),c=course(d.learn);return go("student",{lesson:d.learn+":"+Math.min(e.progress.length,c.lessons.length-1)})}
  if(d.lesson)return go("student",{lesson:d.lesson});
  if(d.enroll){closeModal();return openEnroll(d.enroll)}
  if(d.stab)return go("student",{tab:d.stab});
  if(d.star){starVal=+d.star;$$("#starpick button").forEach(b=>b.classList.toggle("on",+b.dataset.star<=starVal));return}
  if(d.done){const [cid,i]=d.done.split(":");const e=enrFor(cid);const n=+i,c=course(cid);if(!e.progress.includes(n)){e.progress.push(n);save()}
    if(isComplete(e)&&!e.cert){e.cert="XW-"+new Date().getFullYear()+"-"+String(Math.floor(1000+Math.random()*9000));save();toast("Congratulations! You finished the course. Your certificate is ready.");return go("student",{tab:"certs"})}
    if(n<c.lessons.length-1){toast("Lesson completed");return go("student",{lesson:cid+":"+(n+1)})}return render()}
  if(d.sampleid){view.cert=d.sampleid;return render()}
  if(d.copy){if(navigator.clipboard)navigator.clipboard.writeText(d.copy).then(()=>toast("Number copied"),()=>toast(d.copy));else toast(d.copy);return}
  if(d.atab)return go("admin",{tab:d.atab});
  if(d.filter){view.filter=d.filter;return render()}
  const en=id=>S.enrollments.find(e=>e.id===id);
  if(d.approve){en(d.approve).status="approved";save();toast("Payment confirmed. Lessons unlocked.");return render()}
  if(d.reject){en(d.reject).status="rejected";save();toast("Payment rejected");return render()}
  if(d.revoke){en(d.revoke).status="pending";save();toast("Course locked");return render()}
  if(d.grant)return openGrant(d.grant);
  if(d.viewcert){const e=en(d.viewcert);return modal(`<button class="x" data-close aria-label="Close">×</button><div style="clear:both;padding-top:6px">${certHTML(e)}</div>`)}
  if(d.revcert){en(d.revcert).cert="";save();toast("Certificate revoked");return render()}
  if(d.revok){S.reviews.find(r=>r.id===d.revok).status="approved";save();toast("Review approved");return render()}
  if(d.revdel){S.reviews=S.reviews.filter(r=>r.id!==d.revdel);save();return render()}
  if(d.dellesson){const [ci,li]=d.dellesson.split(":").map(Number);S.courses[ci].lessons.splice(li,1);save();return render()}
  const arm=(txt)=>{if(t.dataset.armed)return true;t.dataset.armed="1";t.textContent=txt;return false};
  if(d.delcourse){if(arm("Click again to delete")){S.courses.splice(+d.delcourse,1);save();render()}return}
  if(d.deluser){if(arm("Sure?")){S.users=S.users.filter(u=>u.id!==d.deluser);S.enrollments=S.enrollments.filter(e=>e.user!==d.deluser);save();render()}return}
  if(d.delcat){if(arm("Sure?")){S.categories.splice(+d.delcat,1);save();render()}return}
  if(d.delteam){if(arm("Sure?")){S.team.splice(+d.delteam,1);S.courses.forEach(c=>{if(+c.teacher>=S.team.length)c.teacher=0});save();render()}return}
  if(d.delpartner){S.partners.splice(+d.delpartner,1);save();return render()}
  if(t.id==="themeBtn"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"_theme",r.dataset.theme)}catch(e){}return}
  if(t.id==="heroReset"){S.settings.heroImg="";save();toast("Illustration restored");return render()}
  if(t.id==="smsMatch"){const txt=$("#smsIn").value||"";
    const digits=txt.replace(/\D/g,"");
    const amounts=(txt.match(/\d+(?:\.\d{1,2})?/g)||[]).map(Number);
    const hit=S.enrollments.find(e=>{if(e.status!=="pending")return false;const u=user(e.user);if(!u)return false;
      const last9=String(u.phone).replace(/\D/g,"").slice(-9);
      return last9.length===9&&digits.includes(last9)&&amounts.some(x=>Math.abs(x-Number(e.amount))<0.01)});
    if(!hit){toast("No pending order matches this SMS (phone and amount).");return}
    hit.status="approved";save();toast("Matched "+user(hit.user).name+". Course unlocked.");render();return}
  if(t.id==="logout"){setMe(null);toast("You are logged out");return go("home")}
  if(t.id==="menuBtn")return $("#nav").classList.toggle("open");
  if(t.id==="adminOut"){adminOK=false;return go("home")}
  if(t.id==="addTeam"){S.team.push({name:"New person",role:"Instructor",bio:"",photo:"",founder:false});save();return render()}
  if(t.id==="addCourse"){S.courses.push({id:"c"+Date.now(),title:"New course",cat:S.categories[0]?.id||"",icon:S.categories[0]?.icon||"book",level:"Beginner",price:30,weeks:6,status:"draft",teacher:0,thumb:"",created:today(),desc:"Course description.",outcomes:["Something students will learn"],lessons:[]});save();toast("Draft course created");return render()}
  if(t.id==="resetData"){if(arm("Click again to confirm")){S=clone(DEFAULT);save();setMe(null);toast("Demo data reset");render()}return}
});
document.addEventListener("change",ev=>{
  const el=ev.target,d=el.dataset;
  if(d.cfield){const [ci,k]=d.cfield.split(":");const c=S.courses[ci];
    if(k==="price"||k==="weeks"||k==="teacher")c[k]=Number(el.value);else if(k==="outcomes")c[k]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);else c[k]=el.value;
    if(k==="cat"){const kk=cat(el.value);if(kk)c.icon=kk.icon}
    save();toast("Saved");if(["status","cat","title"].includes(k))render()}
  if("heroimg" in d&&el.files[0])readImg(el.files[0],url=>{S.settings.heroImg=url;save();toast("Hero image updated");render()},1100);
  if(d.cthumb&&el.files[0])readImg(el.files[0],url=>{S.courses[+d.cthumb].thumb=url;save();render()},960);
  if(d.tfield){const [i,k]=d.tfield.split(":");S.team[i][k]=el.value;save();toast("Saved");render()}
  if(d.tfounder){S.team[+d.tfounder].founder=el.checked;save();render()}
  if(d.tphoto&&el.files[0])readImg(el.files[0],url=>{S.team[+d.tphoto].photo=url;save();render()},600);
  if(d.catname){S.categories[+d.catname].name=el.value;save();toast("Saved")}
  if(d.sfield){S.settings[d.sfield]=d.sfield==="graduatesBase"?Number(el.value):el.value;save();toast("Saved")}
  if(d.sale){const s=S.settings.sale;s[d.sale]=d.sale==="on"?el.checked:d.sale==="percent"?Number(el.value):el.value;save();toast("Saved");render()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeModal()});
try{const th=localStorage.getItem(KEY+"_theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
})();
</script>
